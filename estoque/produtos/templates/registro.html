<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Novo Usuário</title>
    <!-- Bootstrap CSS -->
    {% load static %}
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
    <header class="bg-secondary text-white p-3">
        <div class="container">
            <h1>Controle de Estoque</h1>
        </div>
    </header>
    <div class="container mt-5">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-6">
                <h2 class="text-center mb-4">Registrar Novo Usuário</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success btn-block mt-3">Registrar</button>
                </form>
                {% if messages %}
                    <div class="mt-3">
                        {% for message in messages %}
                            <div class="alert alert-danger">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}" class="btn btn-secondary btn-sm">Voltar para Login</a>
                </div>
            </div>
        </div>
    </div>
    <footer class="bg-light text-center p-3 mt-4">
        <p>&copy; 2025 Controle de Estoque</p>
    </footer>
    <!-- Bootstrap JS and dependencies -->
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>
</html>
