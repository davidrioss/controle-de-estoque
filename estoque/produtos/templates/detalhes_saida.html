{% extends 'base.html' %}

{% block title %}Detalhes da Saída{% endblock %}

{% block content %}
    <p></p>
    
    <h2>Detalhes da Saída</h2>
    
    <ul class="list-group">
        <p class="list-group-item"><strong>Data:</strong> {{ saida.data }}</p>
        <p class="list-group-item"><strong>Produto:</strong> {{ saida.produto }}</p>
        <p class="list-group-item"><strong>Quantidade:</strong> {{ saida.quantidade }}</p>
        <p class="list-group-item"><strong>Valor Total:</strong> {{ saida.valor_total }}</p>
    </ul>
    
    <a class="btn btn-success" href="{% url 'atualizar_saida' saida.pk %}">Editar Saída</a>
    <a class="btn btn-danger" href="{% url 'listar_saidas' %}">Voltar</a>

{% endblock %}
